<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">

  <title>Log In — ZATCA Suite</title>
  <meta name="description" content="Log in to your ZATCA Suite compliance dashboard.">
  <meta name="theme-color" content="#004A99">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">

  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('zatca-theme') || 'light');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>

<body>

  <div class="auth">
    <div class="auth__container">

      <!-- Top Bar -->
      <div class="auth__topbar">
        <a href="index.html" class="auth__topbar-logo" aria-label="ZATCA Suite — Home">
          <div class="auth__topbar-logo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
          </div>
          <span class="auth__topbar-logo-text">ZATCA Suite</span>
        </a>
        <div class="auth__controls">
          <button type="button" class="auth__control-btn" data-theme-toggle aria-label="Toggle theme" onclick="Theme.toggle()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button type="button" class="auth__control-btn" onclick="I18n.toggle()" aria-label="Switch language" style="font-size: var(--font-size-overline); font-weight: var(--font-weight-bold);" data-i18n="ctrl.lang">عربي</button>
        </div>
      </div>

      <!-- Form Card -->
      <div class="auth__card">
        <div class="auth__card-header">
          <h1 class="auth__card-title" data-i18n="auth.loginTitle">Welcome back</h1>
          <p class="auth__card-subtitle" data-i18n="auth.loginSubtitle">Sign in to your compliance dashboard</p>
        </div>

        <form class="auth__form" action="dashboard.html" method="GET" onsubmit="window.location.href='dashboard.html'; return false;">

          <!-- Google -->
          <button type="button" class="auth__social-btn" onclick="window.location.href='dashboard.html'">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span data-i18n="auth.google">Continue with Google</span>
          </button>

          <!-- Divider -->
          <div class="auth__divider">
            <span class="auth__divider-text" data-i18n="auth.orDivider">or continue with email</span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="login-email" data-i18n="auth.workEmailLabel">Work Email</label>
            <input class="input" type="email" id="login-email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="name@company.com" required autocomplete="email">
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="login-password" data-i18n="auth.passwordLabel">Password</label>
            <div class="auth__password-field">
              <input class="input" type="password" id="login-password" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="auth__password-toggle" aria-label="Show password" onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <!-- Remember + Forgot -->
          <div class="auth__options-row">
            <label class="checkbox">
              <input type="checkbox" class="checkbox__input" name="remember">
              <span data-i18n="auth.rememberMe">Remember me</span>
            </label>
            <a href="#" class="auth__forgot-link" data-i18n="auth.forgotPassword">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="auth__submit">
            <span data-i18n="auth.loginBtn">Sign In</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>

        </form>
      </div>

      <!-- Trust Badges -->
      <div class="auth__trust">
        <div class="auth__trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>ISO 27001 Certified</span>
        </div>
        <div class="auth__trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>TLS 1.3 Encryption</span>
        </div>
        <div class="auth__trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <span>SOC2 Type II</span>
        </div>
      </div>

      <!-- Alt Link -->
      <p class="auth__alt">
        <span data-i18n="auth.noAccount">Don't have an account?</span>
        <a href="signup.html" data-i18n="auth.signUpLink">Sign Up</a>
      </p>

    </div>
  </div>

  <script src="js/theme.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
